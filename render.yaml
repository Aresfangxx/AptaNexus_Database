services:
  - type: web
    name: aptanexus-api
    runtime: node
    buildCommand: cd mcp-server && npm install && npm run build
    startCommand: cd mcp-server && node dist/src/http-sse.js
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: PORT
        value: 10000
      # The /chat endpoint reads ARK_API_KEY (Volcano Ark / Doubao).
      - key: ARK_API_KEY
        sync: false
      # Correction-report email delivery (Resend HTTP API).
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false
      - key: REPORT_FROM_EMAIL
        sync: false
