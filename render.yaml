services:
  - type: web
    name: aptanexus-api
    runtime: node
    buildCommand: cd mcp-server && npm install && npm run build
    startCommand: cd mcp-server && node dist/src/http-sse.js
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: PORT
        value: 10000
      # LLM provider for /chat. Defaults in code are Volcano Ark / Doubao; these
      # override it to DeepSeek's OpenAI-compatible endpoint (fast "flash" model).
      # Provider URL + model live here (version-controlled); only the key is a
      # dashboard secret — set LLM_API_KEY in Render before this deploys, or /chat
      # will fail auth.
      - key: LLM_URL
        value: https://api.deepseek.com/chat/completions
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_API_KEY
        sync: false
      # Legacy Doubao key (unused once LLM_API_KEY is set; kept as fallback).
      - key: ARK_API_KEY
        sync: false
      # Correction-report email delivery (Resend HTTP API).
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false
      - key: REPORT_FROM_EMAIL
        sync: false
